services:
  neo4j:
    image: neo4j:5.26-community
    container_name: mcp-chat-neo4j
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt (드라이버 접속용)
    environment:
      # .env의 NEO4J_PASSWORD와 반드시 같아야 한다. Neo4j는 8자 이상을 요구한다.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-devpassword}
      # 개발용이라 힙을 작게 잡는다. 기본값은 호스트 메모리에 비례해 크게 잡힌다.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      # bolt가 열렸는지가 아니라 실제 쿼리가 도는지를 본다.
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-devpassword} 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
